name: Reconcile CA9 case supply
on:
  push:
    branches: [main]
    paths:
      - 'supply/requests/**'
      - 'supply/policy.json'
      - 'judgesim/supply.py'
      - 'scripts/sync_supply.py'
      - '.github/workflows/supply-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: judge-save-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_supply.py
      - name: Publish derived supply and new releases
        run: |
          git add -A -- supply factory
          if ! git diff --cached --quiet; then
            git -c user.name='judge-save[bot]' -c user.email='judge-save-bot@users.noreply.github.com' commit -m 'Reconcile CA9 production queue and stock'
            git push origin HEAD:main
          fi
