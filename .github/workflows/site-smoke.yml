name: CA9 public site smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/chambers.js'
      - 'docs/chambers.css'
      - 'scripts/check_site*'
      - '.github/workflows/site-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check_site.py
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Real public browser check
        run: node scripts/check_site_browser.cjs
      - name: Browser screenshots
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ca9-public-site-screenshots
          path: ca9-public-*.png
          retention-days: 7
